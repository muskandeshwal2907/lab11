<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Successful</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      background:linear-gradient(135deg,#059669,#10b981 60%,#0ea5e9)}
    .card{background:#fff;width:100%;max-width:380px;padding:2.5rem 2rem;border-radius:16px;text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .check{width:72px;height:72px;margin:0 auto 1rem;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:2.2rem;background:#d1fae5;color:#059669}
    h1{margin:0 0 .4rem;color:#065f46;font-size:1.6rem}
    p{margin:0 0 1.6rem;color:#4b5563}
    a{display:inline-block;padding:.7rem 1.6rem;border-radius:10px;background:#059669;color:#fff;
      text-decoration:none;font-weight:600}
    a:hover{opacity:.9}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Login Successful</h1>
    <p>Welcome, <strong>{{ username }}</strong>!</p>
    <a href="/">Logout</a>
  </div>
</body>
</html>
