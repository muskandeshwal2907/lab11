<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#2563eb)}
    .card{background:#fff;width:100%;max-width:380px;padding:2.2rem 2rem;border-radius:16px;
      box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .icon{width:56px;height:56px;margin:0 auto 1rem;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:1.6rem;background:#eef2ff}
    h2{margin:0 0 .25rem;text-align:center;color:#111827}
    .sub{margin:0 0 1.5rem;text-align:center;color:#6b7280;font-size:.9rem}
    label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:.35rem}
    input{width:100%;padding:.75rem .9rem;margin-bottom:1.1rem;border:1.5px solid #d1d5db;border-radius:10px;
      font-size:1rem;transition:border-color .2s,box-shadow .2s}
    input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.15)}
    button{width:100%;padding:.8rem;border:0;border-radius:10px;font-size:1rem;font-weight:600;color:#fff;
      cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed);transition:transform .1s,opacity .2s}
    button:hover{opacity:.92}
    button:active{transform:scale(.98)}
    .error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:.7rem .9rem;border-radius:10px;
      margin-bottom:1.1rem;font-size:.9rem}
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="icon">🔐</div>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue</p>
    {% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
    <label for="username">Login name</label>
    <input id="username" type="text" name="username" placeholder="Enter your login name" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Login</button>
  </form>
</body>
</html>
