<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f3f4f6;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    form{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 2px 10px #0002;width:300px}
    input,button{width:100%;padding:.6rem;margin:.4rem 0 1rem;box-sizing:border-box}
    button{background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
    .error{color:#b91c1c;background:#fee2e2;padding:.5rem;border-radius:6px;margin-bottom:1rem}
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h2>Login</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>Login name</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
  </form>
</body>
</html>
